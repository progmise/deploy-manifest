# Deploy manifest — one released set of components deployable together.
# version: bump it per release (semver). A PR bumps it; merge creates a draft
# GitHub Release; publishing the release approves it for `deploy.yml`.
# environments[]: declared deploy targets (name + type), each carrying its
# own infrastructures[] — the OAM model. Infra entries require `id`/`type`
# plus a free-form `properties:` map (e.g. type: vercel uses the consumer
# repo's VERCEL_* secrets/vars; credentialsId names the GitHub secret).
# components[]: repo = GitHub repo, tag = existing git tag (its Docker image
# <DOCKER_USERNAME>/<repo>:<tag> must exist), needs = deploy-after deps,
# infra = infrastructure ids this component deploys to (optional; a bound
# component can only deploy to envs where at least one of its infra ids lives).
version: 1.2.0
environments:
  - name: pro
    type: production
    infrastructures:
      - id: loans-api-pro
        type: vercel
        properties:
          project: loans-api
          credentialsId: VERCEL_TOKEN
          orgIdVar: VERCEL_ORG_ID
          projectIdVar: VERCEL_PROJECT_ID
      - id: docker-hub
        type: artifact-store
        properties:
          registry: docker.io
          project-path: progmise
          usernameId: DOCKER_USERNAME
          passwordId: DOCKER_TOKEN
components:
  - name: loans-api
    repo: progmise/loans-api
    tag: "0.1.0"
    needs: []
    infra: [loans-api-pro]
