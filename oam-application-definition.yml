# OAM application definition — Ensemble's app-model repo.
# One released set of components deployable together — metadata.version is the
# release version (bump it per release; a PR merges → draft GitHub Release;
# publishing the release approves it for deploy.yml).
# environments[]: declared deploy targets (name + type), each carrying its
# own infrastructures[] — infra entries require `id`/`type` plus a free-form
# `properties:` map (type: vercel uses the consumer repo's VERCEL_* secrets/
# vars; credentialsId names the GitHub secret).
# trails[]: ordered promotion paths — environments in `order` sequence.
# components[]: repo = GitHub repo, version = existing git tag (its Docker
# image <DOCKER_USERNAME>/<repo>:<version> must exist), rollback_version =
# previous deployable version, needs = deploy-after deps. Which ci_ids a
# component deploys to is declared in its own repo's `.deploy/targets.yml`
# (each must match an infrastructures[].id here; the orchestrator dispatches
# one deploy per ci_id in the target environment). `infra:` may still
# override per component when needed.
kind: Application
version: v2
metadata:
  name: ensemble
  version: 1.7.2
environments:
  - name: pre
    type: preproduction
    infrastructures:
      - id: loans-api-pre
        type: vercel
        properties:
          project: loans-api
          orgId: VERCEL_ORG_ID
          projectId: VERCEL_PROJECT_ID
          credentialsId: VERCEL_TOKEN
      - id: ensemble-api-pre
        type: vercel
        properties:
          project: ensemble-api
          orgId: VERCEL_ORG_ID
          projectId: VERCEL_PROJECT_ID
          credentialsId: VERCEL_TOKEN
      - id: ensemble-web-pre
        type: vercel
        properties:
          project: ensemble-web
          orgId: VERCEL_ORG_ID
          projectId: VERCEL_PROJECT_ID
          credentialsId: VERCEL_TOKEN
  - name: pro
    type: production
    infrastructures:
      - id: loans-api-pro
        type: vercel
        properties:
          project: loans-api
          orgId: VERCEL_ORG_ID
          projectId: VERCEL_PROJECT_ID
          credentialsId: VERCEL_TOKEN
      - id: ensemble-api-pro
        type: vercel
        properties:
          project: ensemble-api
          orgId: VERCEL_ORG_ID
          projectId: VERCEL_PROJECT_ID
          credentialsId: VERCEL_TOKEN
      - id: ensemble-web-pro
        type: vercel
        properties:
          project: ensemble-web
          orgId: VERCEL_ORG_ID
          projectId: VERCEL_PROJECT_ID
          credentialsId: VERCEL_TOKEN
      - id: docker-hub
        type: artifact-store
        properties:
          registry: docker.io
          project-path: progmise
          usernameId: DOCKER_USERNAME
          passwordId: DOCKER_TOKEN
trails:
  - name: pre-pro-trails
    environments:
      - name: pre
        order: 1
      - name: pro
        order: 2
components:
  - name: loans-api
    repo: progmise/loans-api
    version: "0.1.0"
    needs: []
  - name: ensemble-api
    repo: progmise/ensemble-api
    version: "0.3.3"
    rollback_version: "0.3.2"
    needs: []
  - name: ensemble-web
    repo: progmise/ensemble-web
    version: "1.7.3"
    rollback_version: "1.7.2"
    needs: [ensemble-api]
