name: Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Manifest release version (e.g. 1.0.0)'
        required: true
        type: string
      environment:
        description: 'Target environment'
        required: false
        default: pro
        type: choice
        options: [pro, cert, pre]
      release_no:
        description: 'Dashboard release number (RLSE…) — required for pro'
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Orch Deploy
    uses: progmise/reusable-workflows/.github/workflows/orch-deploy.yml@v1
    secrets: inherit
    with:
      version: ${{ inputs.version }}
      environment: ${{ inputs.environment }}
      release_no: ${{ inputs.release_no }}
